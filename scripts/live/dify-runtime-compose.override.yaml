services:
  api:
    ports:
      - "${AIEBOM_DIFY_API_PORT:-5001}:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_WORKER_AMOUNT: "1"
      ENABLE_OTEL: "true"
      OTLP_BASE_ENDPOINT: "http://host.docker.internal:${AIEBOM_LIVE_HTTP_PORT:-14318}"
      OTLP_API_KEY: "${AIEBOM_LIVE_TOKEN:-dify-runtime-receiver-token}"
      OTEL_EXPORTER_TYPE: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http"
      OTEL_SAMPLING_RATE: "1.0"
      OTEL_BATCH_EXPORT_SCHEDULE_DELAY: "200"
      OTEL_BATCH_EXPORT_TIMEOUT: "10000"
      OTEL_METRIC_EXPORT_INTERVAL: "3600000"

  plugin_daemon:
    extra_hosts:
      - "host.docker.internal:host-gateway"
