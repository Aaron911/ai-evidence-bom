name: Dify full runtime compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/dify-runtime.yml
      - scripts/live/dify-runtime-compose.override.yaml
      - scripts/live/dify_runtime_assert.py
      - scripts/live/fixtures/dify-runtime-workflow.yml
      - scripts/live/verify_dify_runtime.sh
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  dify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned uv
        run: |
          python3 -m venv .ci-tools
          .ci-tools/bin/python -m pip install uv==0.11.21
          echo "$PWD/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Validate a complete Dify runtime export
        run: scripts/live/verify_dify_runtime.sh
