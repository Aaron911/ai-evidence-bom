name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go build ./cmd/aiebom
      - name: Install pinned CycloneDX schema validator
        run: python3 -m pip install --disable-pip-version-check --no-compile jsonschema==4.26.0
      - name: Validate CycloneDX 1.7 export against the official schema
        run: make validate-cyclonedx

  framework-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - scripts/live/verify_agent_framework.sh
          - scripts/live/verify_dify_instrumentation.sh
          - scripts/live/verify_mcp_runtime.sh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned uv
        run: |
          python3 -m venv .ci-tools
          .ci-tools/bin/python -m pip install uv==0.11.21
          echo "$PWD/.ci-tools/bin" >> "$GITHUB_PATH"
      - run: ${{ matrix.check }}

  sarif-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned SARIF validation tools
        run: |
          python3 -m venv .ci-sarif-tools
          .ci-sarif-tools/bin/python -m pip install --disable-pip-version-check --no-compile jsonschema==4.26.0
          GOBIN="$PWD/.ci-sarif-tools/bin" go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          echo "$PWD/.ci-sarif-tools/bin" >> "$GITHUB_PATH"
      - name: Verify the external SARIF findings bridge
        run: make verify-sarif-bridge
